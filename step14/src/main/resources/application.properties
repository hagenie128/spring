# =============================================================================
#  application.properties
#  Spring Boot 애플리케이션 설정 파일입니다.
#
#  [이 파일의 역할]
#  - 서버 포트, DB 접속 정보, JPA 동작 방식 등을 코드 수정 없이 바꿀 수 있습니다.
#  - Spring Boot가 시작될 때 이 값들을 읽어서 자동으로 설정에 반영합니다.
#
#  [관련 라이브러리 = build.gradle 의 dependencies]
#  아래 각 섹션마다 "어떤 스타터(라이브러리 묶음)가 이 설정을 쓰는지" 적어 두었습니다.
# =============================================================================

# -----------------------------------------------------------------------------
# spring.application.name
# [라이브러리] spring-boot-starter (Spring Boot 핵심)
# 애플리케이션 이름. 로그 출력 시 [step14] 처럼 표시됩니다.
# -----------------------------------------------------------------------------
spring.application.name=step14


# =============================================================================
#  JPA / Hibernate 설정
#  [라이브러리] spring-boot-starter-data-jpa
#
#  JPA(Java Persistence API) : Java 객체(Entity)를 DB 테이블과 연결하는 표준 API
#  Hibernate               : JPA를 실제로 구현해 주는 ORM 라이브러리
#  ORM                     : Object-Relational Mapping, 객체 ↔ 테이블 자동 매핑
#  Spring Data JPA         : Repository 인터페이스만으로 DB 접근을 도와주는 Spring 모듈
# =============================================================================

# ddl-auto : 앱 시작 시 DB 테이블(스키마)을 어떻게 다룰지 결정
#   create      : 기존 테이블 삭제 후 새로 생성 (개발·학습용, 데이터 매번 초기화)
#   create-drop : create + 앱 종료 시 테이블 삭제
#   update      : 엔티티 변경분만 테이블에 반영 (데이터 유지)
#   validate    : 엔티티와 테이블 구조가 맞는지만 검사
#   none        : 아무것도 안 함 (운영 환경 권장)
spring.jpa.hibernate.ddl-auto=update

# true 이면 실행되는 SQL을 콘솔(터미널)에 출력 → 학습·디버깅에 유용
spring.jpa.show-sql=true

# SQL을 한 줄이 아니라 들여쓰기 해서 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true

# Dialect(방언) : DB 종류에 맞는 SQL 문법을 Hibernate가 선택하도록 지정
# MySQL 8.x 사용 시 MySQL8Dialect (또는 MySQLDialect)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# =============================================================================
#  서버(웹) 설정
#  [라이브러리] spring-boot-starter-web
#
#  내장 Tomcat 서버가 이 포트로 HTTP 요청을 받습니다.
#  기본값은 8080, 여기서는 8888 로 변경.
#  접속 주소 예) http://localhost:8888/board/list
# =============================================================================
server.port=8888


# =============================================================================
#  Thymeleaf 설정
#  [라이브러리] spring-boot-starter-thymeleaf
#
#  Thymeleaf : HTML 템플릿에 ${변수}, th:text 같은 문법으로 Java 데이터를 끼워 넣는 엔진
#  templates/ 폴더의 .html 파일이 뷰(화면)가 됩니다.
# =============================================================================

# cache=false : 개발 중 HTML/CSS 수정 후 새로고침만으로 바로 반영 (캐시 끔)
# 운영 배포 시에는 true 로 두는 것이 성능에 좋습니다.
spring.thymeleaf.cache=false


# =============================================================================
#  DataSource (데이터베이스 연결) 설정
#  [라이브러리] spring-boot-starter-data-jpa + mysql-connector-j (MySQL 드라이버)
#
#  DataSource : DB와의 연결 통로. HikariCP 라는 커넥션 풀이 기본으로 사용됩니다.
#  JDBC       : Java에서 DB에 접속하는 표준 방식
#  url 형식    : jdbc:mysql://호스트:포트/데이터베이스이름
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/board_jpa_db
spring.datasource.username=root
spring.datasource.password=12345678

# MySQL 8.x JDBC 드라이버 클래스 (mysql-connector-j 라이브러리가 제공)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
