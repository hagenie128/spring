<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">

<head th:fragment="title">
    <title>회원가입</title>
</head>

<body th:fragment="main">
    <form action="/auth/register" method="post" th:object="${form}">
        <div>
            <label for="username">아이디</label>
            <input type="text" th:field="*{username}" placeholder="아이디를 입력하세요">
            <div th:errors="*{username}"></div>
        </div>
        <div>
            <label for="nickname">닉네임</label>
            <input type="text" th:field="*{nickname}" placeholder="닉네임를 입력하세요">
            <div th:errors="*{nickname}"></div>
        </div>
        <div>
            <label for="password">비밀번호</label>
            <input type="password" th:field="*{password}" placeholder="비밀번호를 입력하세요">
            <div th:errors="*{password}"></div>
        </div>
        <div>
            <button>가입하기</button>
            <button type="button" onclick="history.back();">취소</button>
        </div>
    </form>
</body>

</html>
