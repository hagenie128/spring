<!DOCTYPE html>
<!--
================================================================================
  [로그인 화면]
  AuthController.loginView() → GET /auth/login
  AuthController.login()     → POST /auth/login

  [name="username", name="password"]
    @RequestParam("username"), @RequestParam("password") 와 이름이 같아야 합니다.

  [errorMessage]
    로그인 실패 시 RedirectAttributes Flash 로 넘어온 일회성 메시지
================================================================================
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">

<head th:fragment="title">
    <title>로그인</title>
</head>

<body th:fragment="main">
    <div th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></div>
    <form th:action="@{/auth/login}" method="post">
        <div>
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" autofocus required>
        </div>
        <div>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        <div>
            <button type="submit">로그인</button>
            <a th:href="@{/auth/register}">회원가입</a>
            <a href="javascript:history.back();">뒤로 가기</a>
        </div>
    </form>
</body>

</html>
