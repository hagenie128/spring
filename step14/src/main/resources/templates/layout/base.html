<!DOCTYPE html>

<!--
================================================================================
  [이 파일이 하는 일]
  모든 페이지가 공통으로 쓰는 '레이아웃(껍데기)' 입니다.
  상단 메뉴, CSS 링크, 푸터는 여기 한 곳만 수정하면 전체 페이지에 반영됩니다.

  [th:fragment="layout(title, content)"]
  → 다른 HTML(list.html 등)에서 이 틀을 빌려 쓸 수 있게 이름을 붙인 것입니다.
  → title, content 는 각 페이지가 넘겨주는 '조각(fragment)' 자리입니다.
================================================================================
-->

<!--
  xmlns:th : Thymeleaf 속성(th:href, th:if 등) 사용 선언
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
    th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
      th:replace="${title}"
      → 각 페이지의 <head th:fragment="title"> 조각이 이 자리에 통째로 들어옵니다.
      → 그 안의 <title>게시글 목록</title> 이 브라우저 탭 제목이 됩니다.
    -->
    <title th:replace="${title}">Spring 게시판</title>

    <!--
      th:href="@{/css/style.css}"
      → Spring Boot는 src/main/resources/static/ 폴더를 웹 루트(/)로 서빙합니다.
      → static/css/style.css 파일이 /css/style.css 주소로 제공됩니다.
    -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- ========== 상단 헤더 (모든 페이지 공통) ========== -->
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-logo" th:href="@{/board/list}">Spring 게시판</a>

            <nav class="site-nav">

                <!--
                  [세션(session) 이란?]
                  로그인한 사용자 정보를 서버가 브라우저별로 기억해 두는 저장소입니다.
                  session.loginMember : 로그인 시 컨트롤러가 넣어 둔 Member 객체 (아직 미구현이면 항상 null)

                  th:if="${session.loginMember != null}"
                  → loginMember 가 있으면(로그인 상태) 이 블록을 표시
                -->
                <th:block th:if="${session.loginMember != null}">
                    <!--
                      th:block : 화면에 태그 없이 논리만 묶을 때 사용 (div 안 써도 됨)
                      th:text : 문자열 연결도 가능 (닉네임 + '님 로그인...')
                    -->
                    <p class="site-nav__user" th:text="${session.loginMember.nickname + '님 로그인 하셨습니다.'}">ooo님 로그인 하셨습니다.</p>
                </th:block>

                <!-- loginMember 가 null 이면(비로그인) 로그인/회원가입 링크 표시 -->
                <th:block th:if="${session.loginMember == null}">
                    <a th:href="@{/login}">로그인</a>
                    <a th:href="@{/join}">회원가입</a>
                </th:block>
            </nav>
        </div>
    </header>

    <!-- ========== 본문 영역 ========== -->
    <main class="container">

        <!--
          [일회성 알림 메시지]
          컨트롤러에서 view.addObject("message", "저장되었습니다") 처럼 넘기면 표시됩니다.
          th:onclick : HTML 속성에 JavaScript 를 쓸 때 (닫기 버튼)
        -->
        <div class="alert" th:if="${message}">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" th:onclick="this.closest('div').remove()">X</button>
        </div>

        <!--
          th:replace="${content}"
          → list.html 등에서 넘긴 th:fragment="main" 본문이 이 자리에 삽입됩니다.
          → 실제 게시판 목록 테이블은 여기 들어옵니다.
        -->
        <th:block th:replace="${content}"></th:block>
    </main>

    <footer class="site-footer">
        <small>Spring Boot + JPA + Thymeleaf + Quill 실습</small>
    </footer>
</body>
</html>
