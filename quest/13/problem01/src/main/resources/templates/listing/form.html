<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>판매글 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>:root { --carrot: #ff6f0f; } .btn-carrot { background: var(--carrot); color: #fff; border: none; }</style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 560px;">
    <h4 class="mb-3" th:text="${listing.id != null} ? '판매글 수정' : '판매글 등록'">판매글 등록</h4>

    <!-- ━━ TODO 13~14 ━━ -->
    <form th:action="${listing.id != null} ? @{/listings/{id}(id=${listing.id})} : @{/listings}"
          th:object="${listing}" method="post" class="bg-white p-4 rounded shadow-sm">
        <input type="hidden" th:if="${listing.id != null}" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">제목</label>
            <input type="text" class="form-control" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">설명</label>
            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
            <small class="text-muted">2교시부터 Quill 에디터로 교체</small>
        </div>
        <div class="mb-3">
            <label class="form-label">가격 (원)</label>
            <input type="number" class="form-control" th:field="*{price}" min="0" required>
        </div>
        <div class="mb-3">
            <label class="form-label">카테고리</label>
            <!-- TODO 13: categories 로 select option -->
            <select class="form-select" th:field="*{category}" required>
                <option value="">선택</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">동네</label>
            <!-- TODO 14: districts -->
            <select class="form-select" th:field="*{district}" required>
                <option value="">선택</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">판매자 닉네임</label>
            <input type="text" class="form-control" th:field="*{sellerNickname}" required>
            <small class="text-muted">2교시부터 로그인 회원으로 자동 설정</small>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-carrot">저장</button>
            <a th:href="@{/listings}" class="btn btn-outline-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
