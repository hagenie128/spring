<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h2>도서 등록</h2>
<!-- TODO: th:action, th:object, th:field -->
<form th:action="@{/books}" th:object="${book}" method="post">
  <p>제목: <input th:field="*{title}" /></p>
  <p>저자: <input th:field="*{author}" /></p>
  <p>가격: <input th:field="*{price}" type="number" /></p>
  <p>출판일: <input th:field="*{publishedDate}" type="date" /></p>
  <button type="submit">등록</button>
</form>
<a th:href="@{/books}">목록</a>
</body>
</html>
