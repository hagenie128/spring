<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>스터디 모집</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <h1>스터디 모집</h1>

    <form class="toolbar" th:action="@{/studies}" method="get">
        <!-- TODO problem01-11: 검색 입력값 유지 -->
        <input type="text" name="keyword" placeholder="제목, 소개글, 기술스택 검색">
        <select name="status">
            <option value="">전체</option>
            <!-- TODO problem01-11: 모집 상태 option 출력 -->
        </select>
        <button class="btn" type="submit">검색</button>
        <a class="btn btn-secondary" th:href="@{/studies/new}">모집 등록</a>
    </form>

    <!-- TODO problem01-11: 모집글 카드 목록, 정원, 상태 출력 -->
    <section class="study-grid">
        <!-- TODO problem01-11: 모집글 목록 출력 -->
        <article class="study-card">
            <span class="badge">모집상태</span>
            <h3>
                <a href="#">스터디 제목</a>
            </h3>
            <p>소개글</p>
            <p class="meta">Java, Spring</p>
            <p>
                <strong>0</strong>
                /
                <span>4</span>
                명 확정
            </p>
            <p class="meta">리더 · 온라인</p>
        </article>
    </section>

    <!-- TODO problem01-11: 빈 목록 안내 -->

    <!-- TODO problem01-11: 검색 파라미터 유지 페이징 -->
    <ul class="pagination">
        <!-- TODO problem01-11: 페이징 링크 -->
    </ul>
</main>
</body>
</html>
