<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대출 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">📖 새 대출 등록</h2>
    <p class="text-muted small">quest/12 problem03 — @RequestParam + List 파라미터 연습</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/loans}" method="post">

        <div class="mb-4">
            <label class="form-label fw-bold">학생 선택 <span class="text-danger">*</span></label>
            <!-- TODO 10: students 로 option 생성 (name="studentId") -->
            <select name="studentId" class="form-select" required>
                <option value="">-- 학생 선택 --</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">도서 선택</label>
            <p class="text-muted small">수량 1 이상만 대출에 포함 (0 = 미선택)</p>
            <table class="table table-bordered">
                <thead class="table-light">
                <tr><th>제목</th><th>저자</th><th style="width:120px">수량</th></tr>
                </thead>
                <tbody>
                <!-- TODO 11: books 반복 — hidden bookIds + number quantities -->
                <tr>
                    <td colspan="3" class="text-muted text-center">TODO 11</td>
                </tr>
                </tbody>
            </table>
        </div>

        <button type="submit" class="btn btn-primary">대출 등록</button>
        <a th:href="@{/loans}" class="btn btn-secondary">취소</a>
    </form>
</div>
</body>
</html>
