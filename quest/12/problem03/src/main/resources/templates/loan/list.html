<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대출 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>📚 대출 목록</h2>
        <a th:href="@{/loans/new}" class="btn btn-warning">+ 새 대출</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="get" th:action="@{/loans}" class="row g-2 mb-3 p-3 bg-light rounded">
        <div class="col-auto"><label class="col-form-label">학생</label></div>
        <div class="col-auto">
            <select name="studentId" class="form-select">
                <option value="">전체</option>
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${selectedStudentId != null and selectedStudentId == s.id}"></option>
            </select>
        </div>
        <div class="col-auto"><label class="col-form-label">상태</label></div>
        <div class="col-auto">
            <select name="status" class="form-select">
                <option value="">전체</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.label}"
                        th:selected="${selectedStatus != null and selectedStatus == st}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">검색</button>
            <a th:href="@{/loans}" class="btn btn-outline-secondary">초기화</a>
        </div>
    </form>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>번호</th><th>학생</th><th>대출일</th><th>권수</th><th>상태</th><th>상세</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${loans}">
            <td th:text="${loan.id}"></td>
            <td th:text="${loan.student.name}"></td>
            <td th:text="${#temporals.format(loan.loanDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${loan.loanItems.size()} + '권'"></td>
            <td th:text="${loan.status.label}"></td>
            <td><a th:href="@{/loans/{id}(id=${loan.id})}" class="btn btn-sm btn-info">상세</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
