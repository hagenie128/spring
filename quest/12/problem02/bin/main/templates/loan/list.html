<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대출 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">📚 대출 목록</h2>
    <p class="text-muted small">quest/12 problem02 — @RequestParam 검색 연습</p>

    <!-- ━━ 그룹 C: TODO 8~9 ━━ -->
    <form method="get" th:action="@{/loans}" class="row g-2 mb-3 p-3 bg-light rounded">
        <div class="col-auto"><label class="col-form-label">학생</label></div>
        <div class="col-auto">
            <!-- TODO 8: students 로 option 반복, th:selected 로 selectedStudentId 유지 -->
            <select name="studentId" class="form-select">
                <option value="">전체</option>
                <option th:each="s : ${students}"
                        th:value="${s.id}"
                        th:text="${s.name}"
                        th:selected="${selectedStudentId != null and selectedStudentId == s.id}">
                    </option>
            </select>
        </div>
        <div class="col-auto"><label class="col-form-label">상태</label></div>
        <div class="col-auto">
            <!-- TODO 9: statuses 로 option 반복 (th:text="${s.label}") -->
            <select name="status" class="form-select">
                <option value="">전체</option>
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s.label}"
                        th:selected="${selectedStatus != null and selectedStatus == s}">
                    </option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">검색</button>
            <a th:href="@{/loans}" class="btn btn-outline-secondary">초기화</a>
        </div>
    </form>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>대출번호</th>
            <th>학생명</th>
            <th>대출일시</th>
            <th>권수</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="loan : ${loans}">
            <td th:text="${loan.id}"></td>
            <td th:text="${loan.student.name}"></td>
            <td th:text="${#temporals.format(loan.loanDate, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${loan.loanItems.size()} + '권'"></td>
            <td th:text="${loan.status.label}"></td>
        </tr>
        <tr th:if="${loans != null and loans.empty}">
            <td colspan="5" class="text-center text-muted">대출 내역이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
