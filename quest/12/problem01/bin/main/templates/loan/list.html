<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대출 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-4">📚 도서관 대출 목록</h2>
  <p class="text-muted small">quest/12 problem01 — JOIN FETCH 연습</p>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
      <th>대출번호</th>
      <th>학생명</th>
      <th>대출일시</th>
      <th>권수</th>
      <th>상태</th>
    </tr>
    </thead>
    <tbody>
    <!--
      ━━ 그룹 C: TODO 8, 9 ━━

      TODO 8: tr에 th:each="loan : ${loans}" 추가
      TODO 9: 각 td에 아래 값 출력
        - loan.id
        - loan.student.name   ← JOIN FETCH 결과
        - loan.loanDate       (힌트: #temporals.format(loan.loanDate, 'yyyy-MM-dd HH:mm'))
        - loan.loanItems.size()
        - loan.status.label
    -->
    <tr th:each="loan:${loans}">
      <td th:text="${loan.id}"></td>
      <td th:text="${loan.student.name}"></td>
      <td th:text="${#temporals.format(loan.loanDate, 'yyyy-MM-dd HH:mm')}"></td>
      <td th:text="${loan.loanItems.size()}"></td>
      <td th:text="${loan.status.label}"></td>
    </tr>
    <tr th:if="${loans != null and loans.empty}">
      <td colspan="5" class="text-center text-muted">
        대출 내역이 없습니다. (그룹 A~B TODO를 먼저 완성했는지 확인하세요)
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
