<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대출 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <!-- TODO 10: 제목에 loan.id 출력 -->
    <h2 class="mb-4">대출 상세</h2>

    <div class="card mb-4">
        <div class="card-header fw-bold">대출 정보</div>
        <div class="card-body">
            <dl class="row mb-0">
                <!-- TODO 11: loan.student.name, loan.loanDate, loan.status -->
                <dt class="col-sm-2">학생</dt>
                <dd class="col-sm-10">???</dd>
                <dt class="col-sm-2">대출일</dt>
                <dd class="col-sm-10">???</dd>
                <dt class="col-sm-2">상태</dt>
                <dd class="col-sm-10">???</dd>
            </dl>
        </div>
    </div>

    <h5 class="mb-3">대출 도서</h5>
    <table class="table table-bordered">
        <thead class="table-light">
        <tr><th>제목</th><th>저자</th><th>수량</th></tr>
        </thead>
        <tbody>
        <!-- TODO 12: loan.loanItems 반복 — item.book.title, item.book.author, item.quantity -->
        <tr><td colspan="3" class="text-muted text-center">TODO 12</td></tr>
        </tbody>
    </table>

    <!-- TODO 13: 상태 변경 폼 — POST /loans/{id}/status, name="status" -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="post" th:action="@{/loans/{id}/status(id=${loan.id})}" class="row g-2">
                <div class="col-auto">
                    <select name="status" class="form-select">
                        <!-- statuses 로 option -->
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">상태 변경</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TODO 14: 삭제 폼 — POST /loans/{id}/delete -->
    <form method="post" th:action="@{/loans/{id}/delete(id=${loan.id})}">
        <button type="submit" class="btn btn-danger"
                onclick="return confirm('정말 삭제하시겠습니까?')">대출 삭제</button>
    </form>

    <a th:href="@{/loans}" class="btn btn-secondary mt-3">← 목록</a>
</div>
</body>
</html>
