<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대출 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">📖 새 대출 등록</h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/loans}" method="post">
        <div class="mb-4">
            <label class="form-label fw-bold">학생 선택</label>
            <select name="studentId" class="form-select" required>
                <option value="">-- 학생 선택 --</option>
                <option th:each="s : ${students}" th:value="${s.id}"
                        th:text="${s.name} + ' (' + ${s.studentNumber} + ')'"></option>
            </select>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
            <tr><th>제목</th><th>저자</th><th style="width:120px">수량</th></tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td>
                    <input type="hidden" name="bookIds" th:value="${book.id}" />
                    <input type="number" name="quantities" min="0" max="99" value="0"
                           class="form-control form-control-sm text-center" />
                </td>
            </tr>
            </tbody>
        </table>
        <button type="submit" class="btn btn-primary">대출 등록</button>
        <a th:href="@{/loans}" class="btn btn-secondary">취소</a>
    </form>
</div>
</body>
</html>
